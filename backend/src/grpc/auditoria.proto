syntax = "proto3";

package auditoria;

// El servicio de auditoría
service AuditoriaService {
  rpc createAuditoria (AuditoriaRequest) returns (AuditoriaResponse);
}

message AuditoriaRequest {
  string token = 1;
  int32 id_funcion = 2;
  string accion = 3;
  string descripcion = 4;
  string observacion = 5;
  string ip_usuario = 6;
}

// La respuesta que devuelve su servidor
message AuditoriaResponse {
  bool success = 1;
  string message = 2;
}
