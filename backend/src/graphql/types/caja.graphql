"""Representa una caja física o lógica en el punto de venta."""
type Caja {
  id: ID!
  codigo: String!
  descripcion: String!
  estado: String!
  establecimiento: String!
  puntoEmision: String!
  secuencialActual: Int!
}

"""Representa el turno de trabajo de un cajero."""
type SesionCaja {
  id: ID!
  cajaId: ID!
  caja: Caja
  usuarioId: String!
  fechaApertura: DateTime!
  montoApertura: Float!
  cantidadFacturas: Int!
  totalVentasEfectivo: Float!
  totalVentasCredito: Float!
  fechaCierre: DateTime
  montoCierreEsperado: Float!
  montoCierreReal: Float
  faltante: Float
  sobrante: Float
  estado: String! # 'ABIERTA' 'EN_REVISION' 'CERRADA'
}

# --- INPUTS ---

input CrearCajaInput {
  codigo: String!
  descripcion: String!
  establecimiento: String!
  puntoEmision: String!
  """Opcional. Si no se envía, la base de datos pondrá 0 por defecto"""
  secuencialActual: Int
}

input ActualizarCajaInput {
  codigo: String
  descripcion: String
  establecimiento: String
  puntoEmision: String
  secuencialActual: Int
  estado: String
}

input AbrirSesionCajaInput {
  cajaId: ID!
  montoApertura: Float!
}

# NUEVO: Input para que el cajero mande su conteo de dinero a revisión
input RevisarSesionCajaInput {
  sesionCajaId: ID!
  montoCierreReal: Float!
}

# NUEVO: Estructura para distribuir el dinero en las cuentas
input DistribucionCuentaInput {
  cuentaId: ID!
  monto: Float!
}

# ACTUALIZADO: Input para que el admin apruebe y deposite
input CerrarSesionCajaInput {
  sesionCajaId: ID!
  distribucionCuentas: [DistribucionCuentaInput!]!
}

# --- QUERIES Y MUTATIONS ---

extend type Query {
  """Lista todas las cajas (Para el admin o para escoger al iniciar turno)"""
  obtenerCajas: [Caja!]!
  """Obtiene una caja en específico para el formulario de edición"""
  obtenerCaja(id: ID!): Caja
  """Útil para validar si el usuario actual ya tiene un turno abierto"""
  obtenerSesionActiva(usuarioId: String!): SesionCaja
}

extend type Mutation {
  # Administración de Cajas
  crearCaja(input: CrearCajaInput!): Caja!
  actualizarCaja(id: ID!, input: ActualizarCajaInput!): Caja!
  inactivarCaja(id: ID!): Caja!

  # Operación de Turnos (Cajero y Admin)
  abrirSesionCaja(input: AbrirSesionCajaInput!): SesionCaja!
  
  """Pasa la caja a estado EN_REVISION (Ejecutado por el cajero)"""
  revisarSesionCaja(input: RevisarSesionCajaInput!): SesionCaja!
  
  """Pasa la caja a estado CERRADA y genera los movimientos bancarios (Ejecutado por el Admin)"""
  cerrarSesionCaja(input: CerrarSesionCajaInput!): SesionCaja!
}