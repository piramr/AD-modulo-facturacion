# --- TIPOS ---

type SaldoCuenta {
  cuentaId: ID!
  nombre: String
  codigo: String
  entidadBancaria: String
  titular: String
  tipoCuenta: String
  nroCuenta: String
  ruc: String
  saldoActual: Float!
  saldoDisponible: Float
  ultimaActualizacion: DateTime
  movimientos: [MovimientoCuenta!]!
}

type MovimientoCuenta {
  id: ID!
  cuentaId: ID!
  cuentaNombre: String
  entidadBancaria: String
  titular: String
  tipoCuenta: String
  nroCuenta: String
  tipo: String! # 'INGRESO' o 'EGRESO'
  monto: Float!
  descripcion: String!
  referencia: String
  """Cambiado a fechaMovimiento para coincidir con tu modelo de Sequelize"""
  fechaMovimiento: DateTime!
}

# --- INPUTS ---

input CrearSaldoCuentaInput {
  cuentaId: ID!
  saldoActual: Float
}

input ActualizarSaldoCuentaInput {
  saldoActual: Float!
}

input MovimientoInput {
  cuentaId: ID!
  tipo: String! # 'INGRESO' o 'EGRESO'
  monto: Float!
  descripcion: String!
  referencia: String
}

# --- QUERIES Y MUTATIONS ---

extend type Query {
  """Moreta usará esto para ver cuánto dinero hay en una cuenta específica"""
  saldoCuenta(cuentaId: ID!): SaldoCuenta!
  """Lista todas las cuentas bancarias registradas con sus saldos y movimientos"""
  obtenerSaldosCuentas: [SaldoCuenta!]!
  movimientosCuenta(limit: Int): [MovimientoCuenta!]!
}

extend type Mutation {
  # --- Gestión Administrativa de Saldos ---
  crearSaldoCuenta(input: CrearSaldoCuentaInput!): SaldoCuenta!
  actualizarSaldoCuenta(id: ID!, input: ActualizarSaldoCuentaInput!): SaldoCuenta!
  inactivarSaldoCuenta(id: ID!): SaldoCuenta!

  # --- Operaciones / Movimientos ---
  """Se abona con cierre de caja o CXC usa esto para meter o sacar dinero"""
  crearMovimiento(input: MovimientoInput!): SaldoCuenta!
}
